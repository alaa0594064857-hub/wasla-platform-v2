name: Generate WASLA Database Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and Validate Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate migration
        run: pnpm db:generate

      - name: Validate migration
        run: pnpm db:check

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/drizzle

          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Generate initial database migration"
            git push origin HEAD:main
          fi
