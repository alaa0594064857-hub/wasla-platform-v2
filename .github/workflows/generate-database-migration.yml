name: Generate WASLA Database Migration

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate and Validate Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate migration
        run: pnpm db:generate

      - name: Validate migration
        run: pnpm db:check

      - name: Create or update migration pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/database-migration
          delete-branch: true
          commit-message: "Generate database migration"
          title: "chore(db): generate database migration"
          body: |
            Automated database migration generated from the current Drizzle schema.

            Review the SQL carefully before merging. This workflow never pushes generated migrations directly to `main`.
          add-paths: |
            apps/api/drizzle/
