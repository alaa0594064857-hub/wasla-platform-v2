name: WASLA CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-check:
    name: WASLA Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla_test_password
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wasla:wasla_test_password@localhost:5432/wasla_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test shared package
        run: pnpm --filter @wasla/shared test

      - name: TypeScript check shared package
        run: pnpm --filter @wasla/shared typecheck

      - name: Test API
        run: pnpm --filter @wasla/api test

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed authorization roles and permissions
        run: |
          pnpm --filter @wasla/api db:seed
          pnpm --filter @wasla/api db:seed

      - name: Test database constraints
        run: pnpm --filter @wasla/api test:integration

      - name: TypeScript check API
        run: pnpm --filter @wasla/api typecheck

      - name: Build API
        run: pnpm --filter @wasla/api build

      - name: TypeScript check web application
        run: pnpm --filter @wasla/web typecheck

      - name: Build web application
        run: pnpm --filter @wasla/web build
