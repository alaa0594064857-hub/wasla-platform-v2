name: WASLA API quality checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: api-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run API tests
        run: pnpm --filter @wasla/api test
      - name: Build API
        run: pnpm --filter @wasla/api build
