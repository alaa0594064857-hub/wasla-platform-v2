name: WASLA API quality checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: api-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla_test_password
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wasla:wasla_test_password@localhost:5432/wasla_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run API tests
        run: pnpm --filter @wasla/api test
      - name: Build API
        run: pnpm --filter @wasla/api build
      - name: Typecheck mobile app
        run: pnpm --filter @wasla/mobile typecheck

      - name: Validate Expo native app config
        run: pnpm --filter @wasla/mobile exec expo config --type public
